name: Release

on:
  push:
    tags: [v*.*.*]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archive
        env:
          VERSION: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -eu
          mkdir -p dist
          go build -trimpath -o smt ./cmd/smt
          tar -czf "dist/smt_${VERSION}_${OS}_${ARCH}.tar.gz" smt
          rm smt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/smt_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create checksums
        run: sha256sum dist/smt_*.tar.gz > dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/checksums.txt
          if-no-files-found: error

  publish:
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/smt_${VERSION}_linux_amd64.tar.gz dist/smt_${VERSION}_linux_arm64.tar.gz dist/smt_${VERSION}_darwin_amd64.tar.gz dist/smt_${VERSION}_darwin_arm64.tar.gz dist/checksums.txt
