version: '3'

vars:
  SMT_BIN: '{{.ROOT_DIR}}/bin/smt'

tasks:
  default:
    desc: List available SMT development tasks
    cmds:
      - task --list

  build:
    desc: Build the repository-local SMT binary
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/bin"
      - go build -o "{{.SMT_BIN}}" ./cmd/smt

  release:build:
    desc: Build and package release archives without remote Git actions
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: VERSION is required; use task release:build VERSION=vX.Y.Z
      - sh: printf '%s' "{{.VERSION}}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        msg: VERSION must match strict vMAJOR.MINOR.PATCH
      - sh: test "{{.RELEASE_TAG}}" != "true" || test -z "$(git status --porcelain --untracked-files=all)"
        msg: release:tag requires a fully clean worktree before building release artifacts
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/dist"
      - |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          OS="${target%/*}"
          ARCH="${target#*/}"
          CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build -trimpath -o "$tmp/smt" ./cmd/smt
          tar -czf "{{.ROOT_DIR}}/dist/smt_{{.VERSION}}_${OS}_${ARCH}.tar.gz" -C "$tmp" smt
        done
        (cd "{{.ROOT_DIR}}/dist" && shasum -a 256 smt_{{.VERSION}}_*.tar.gz > checksums.txt)

  release:tag:
    desc: Build, tag, and push one release tag
    deps:
      - task: release:build
        vars:
          RELEASE_TAG: 'true'
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: VERSION is required; use task release:tag VERSION=vX.Y.Z
      - sh: printf '%s' "{{.VERSION}}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        msg: VERSION must match strict vMAJOR.MINOR.PATCH
    cmds:
      - task verify
      - git tag -a "{{.VERSION}}" -m "Release {{.VERSION}}"
      - git push origin "refs/tags/{{.VERSION}}"

  verify:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  hooks:install:
    desc: Install the Lefthook commit-msg hook
    preconditions:
      - sh: command -v lefthook
        msg: lefthook is required; install it before running task setup
      - sh: test -x "{{.SMT_BIN}}"
        msg: bin/smt is missing; run task build before installing hooks
    cmds:
      - lefthook install

  setup:
    desc: Build prerequisites are checked, then install repository Git hooks
    deps:
      - hooks:install

  commit:validate:
    desc: Validate one complete commit-message file through SMT
    vars:
      MESSAGE_FILE: '{{.CLI_ARGS}}'
    preconditions:
      - sh: test -n "{{.MESSAGE_FILE}}"
        msg: pass the commit-message file path after --
      - sh: test -f "{{.MESSAGE_FILE}}"
        msg: commit-message file does not exist
      - sh: test -x "{{.SMT_BIN}}"
        msg: bin/smt is missing; run task build before validating commits
    cmds:
      - '"{{.SMT_BIN}}" validate-message "{{.MESSAGE_FILE}}"'
